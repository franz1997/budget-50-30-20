<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <title>Spese · Budget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Spese</h1>
    <div class="month-nav" aria-label="Selezione mese">
      <button id="prev" class="icon-btn" aria-label="Mese precedente">‹</button>
      <button id="month" class="month-label" aria-label="Torna al mese corrente"></button>
      <button id="next" class="icon-btn" aria-label="Mese successivo">›</button>
    </div>
  </header>

  <main>
    <section class="mini-grid" id="mini"></section>

    <section class="card" id="expenses-card">
      <h2>Aggiungi spesa</h2>
      <form id="expense-form">
        <input type="text" id="exp-desc" placeholder="Descrizione (es. Affitto)" required>
        <input type="number" id="exp-amount" min="0.01" step="0.01" inputmode="decimal" placeholder="Importo €" required>
        <select id="exp-bucket" aria-label="Categoria">
          <option value="needs">Necessità</option>
          <option value="wants">Desideri</option>
          <option value="savings">Risparmio</option>
        </select>
        <select id="exp-target" hidden aria-label="Conto di destinazione">
          <option value="emergency">→ Fondo emergenza</option>
          <option value="invest">→ Conto investimenti</option>
        </select>
        <button type="submit">Aggiungi</button>
      </form>

      <div class="card-head list-head">
        <h2>Elenco</h2>
      </div>
      <div class="chips" id="filters">
        <button class="chip active" data-filter="all">Tutte</button>
        <button class="chip" data-filter="needs">Necessità</button>
        <button class="chip" data-filter="wants">Desideri</button>
        <button class="chip" data-filter="savings">Risparmio</button>
      </div>
      <ul class="expense-list" id="expense-list"></ul>
      <p class="empty" id="expense-empty">Nessuna spesa per questo mese.</p>
    </section>
  </main>

  <nav class="tabbar" aria-label="Pagine">
    <a href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
      <span>Panoramica</span>
    </a>
    <a href="spese.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span>Spese</span>
    </a>
    <a href="conti.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg>
      <span>Conti</span>
    </a>
    <a href="statistiche.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-6"/></svg>
      <span>Statistiche</span>
    </a>
  </nav>

  <script src="app.js"></script>
  <script src="spese.js"></script>
</body>
</html>
