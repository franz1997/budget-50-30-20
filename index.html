<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <title>Panoramica · Budget 50-30-20</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">€</span>
      <div>
        <h1>Budget 50-30-20</h1>
        <p class="subtitle">Risparmi fissi, poi necessità e desideri nel rapporto 50 · 30</p>
      </div>
    </div>
    <nav class="month-nav" aria-label="Selezione mese">
      <button id="prev" class="icon-btn" aria-label="Mese precedente">‹</button>
      <input type="month" id="month" aria-label="Mese">
      <button id="next" class="icon-btn" aria-label="Mese successivo">›</button>
      <button id="today" class="ghost">Oggi</button>
    </nav>
  </header>

  <nav class="tabs" aria-label="Pagine">
    <a href="index.html">Panoramica</a>
    <a href="spese.html">Spese</a>
    <a href="conti.html">Conti</a>
    <a href="statistiche.html">Statistiche</a>
  </nav>

  <main>
    <section class="stats" id="stats"></section>

    <div class="grid">
      <section class="card" id="income-card">
        <h2>Stipendio del mese</h2>
        <form id="income-form">
          <div class="input-prefix">
            <span>€</span>
            <input type="number" id="income" min="0" step="0.01" placeholder="0,00" required>
          </div>
          <button type="submit">Salva</button>
        </form>
        <p class="hint" id="income-hint"></p>
      </section>

      <section class="card" id="split-card">
        <h2>Ripartizione del disponibile</h2>
        <div class="split-wrap">
          <div id="donut" class="donut-wrap"></div>
          <ul class="legend" id="split-legend"></ul>
        </div>
        <p class="empty" id="split-empty">Inserisci lo stipendio per vedere la ripartizione.</p>
        <div class="buckets" id="buckets"></div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="home.js"></script>
</body>
</html>
