<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <title>Panoramica · Budget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Panoramica</h1>
    <div class="month-nav" aria-label="Selezione mese">
      <button id="prev" class="icon-btn" aria-label="Mese precedente">‹</button>
      <button id="month" class="month-label" aria-label="Torna al mese corrente"></button>
      <button id="next" class="icon-btn" aria-label="Mese successivo">›</button>
    </div>
  </header>

  <main>
    <section class="stats" id="stats"></section>

    <div class="grid">
      <section class="card" id="income-card">
        <h2>Stipendio</h2>
        <form id="income-form">
          <div class="input-prefix">
            <span>€</span>
            <input type="number" id="income" min="0" step="0.01" inputmode="decimal" placeholder="0,00" required>
          </div>
          <button type="submit">Salva</button>
        </form>
        <p class="hint" id="income-hint"></p>
      </section>

      <section class="card" id="split-card">
        <h2>Ripartizione</h2>
        <div class="split-wrap">
          <div id="donut" class="donut-wrap"></div>
          <ul class="legend" id="split-legend"></ul>
        </div>
        <p class="empty" id="split-empty">Inserisci lo stipendio per vedere la ripartizione.</p>
        <div class="buckets" id="buckets"></div>
      </section>
    </div>
  </main>

  <nav class="tabbar" aria-label="Pagine">
    <a href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
      <span>Panoramica</span>
    </a>
    <a href="spese.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span>Spese</span>
    </a>
    <a href="conti.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg>
      <span>Conti</span>
    </a>
    <a href="statistiche.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-6"/></svg>
      <span>Statistiche</span>
    </a>
  </nav>

  <script src="app.js"></script>
  <script src="home.js"></script>
</body>
</html>
